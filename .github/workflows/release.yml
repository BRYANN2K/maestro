name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publication-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub and npm release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@bryann2k"
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1
      - name: Verify tag, commit, and npm versions match
        id: release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit" || {
            echo "tag $RELEASE_TAG does not point to checked-out commit $head_commit" >&2
            exit 1
          }
          tag_version="${RELEASE_TAG#v}"
          package_name="$(node -p "require('./npm/package.json').name")"
          package_version="$(node -p "require('./npm/package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "tag $tag_version does not match npm $package_version" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "package=$package_name" >> "$GITHUB_OUTPUT"
      - name: Install pinned quality tools
        run: make tools
      - name: Run release gates
        run: make release-check
      - name: Check for an existing GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub release $RELEASE_TAG already exists; verifying it instead of republishing."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        if: steps.github_release.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          published_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          expected_assets=(
            checksums.txt
            "maestro_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "maestro_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "maestro_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "maestro_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "maestro_${RELEASE_VERSION}_windows_amd64.zip"
            "maestro_${RELEASE_VERSION}_windows_arm64.zip"
          )
          for asset in "${expected_assets[@]}"; do
            grep -Fxq "$asset" <<< "$published_assets" || {
              echo "GitHub release $RELEASE_TAG is missing $asset" >&2
              exit 1
            }
          done
      - name: Check for an existing npm package
        id: npm_package
        working-directory: npm
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          view_error="$(mktemp)"
          if published_shasum="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.shasum 2>"$view_error")"; then
            rm -f -- "$view_error"
            tarball="$(npm pack --silent | tail -n 1)"
            local_shasum="$(sha1sum "$tarball" | awk '{print $1}')"
            rm -f -- "$tarball"
            test "$local_shasum" = "$published_shasum" || {
              echo "npm ${PACKAGE_NAME}@${PACKAGE_VERSION} exists but its tarball does not match this tag" >&2
              echo "local:     $local_shasum" >&2
              echo "published: $published_shasum" >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists and matches this tag."
          elif grep -q "E404" "$view_error"; then
            rm -f -- "$view_error"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$view_error" >&2
            rm -f -- "$view_error"
            exit 1
          fi
      - name: Publish scoped npm package through trusted publishing
        if: steps.npm_package.outputs.exists != 'true'
        working-directory: npm
        run: npm publish --access public
      - name: Verify npm publication
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: test "$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version)" = "$PACKAGE_VERSION"
